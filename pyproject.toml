[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unredact-tools"
version = "0.2.0"
description = "See what metadata and hidden content your files leak, then scrub them."
requires-python = ">=3.10"
dependencies = ["pillow>=10.3", "pymupdf>=1.24", "pikepdf>=8", "lxml>=5"]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
vision = ["opencv-python-headless>=4.8", "zxing-cpp>=2.2", "numpy>=1.24"]
dev = ["pytest", "piexif", "python-docx>=1.2", "openpyxl", "python-pptx"]
all = ["unredact-tools[heic,vision]"]

[project.urls]
Homepage = "https://github.com/NPCmillionaire/unredact.tools"

[project.scripts]
"unredact.tools" = "unredact_tools.cli:main"
unredact = "unredact_tools.cli:main"
unredact-file = "unredact_tools.cli:main"  # legacy alias

[tool.setuptools]
packages = ["unredact_tools", "unredact_tools.models"]

[tool.setuptools.package-data]
"unredact_tools.models" = ["*.onnx", "LICENSE-*", "README.md"]
