name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e ".[dev,vision,geo]"
      - run: pytest -q

  installer:
    # runs the real one-line installer on clean Linux and macOS runners
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh
        if: runner.os == 'Linux'
      - name: install (piped, like users run it)
        run: cat install.sh | bash -s -- --from . -y
      - name: smoke test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          unredact.tools --version
          unredact tip --no-color
          python3 -m pip install -q pillow piexif
          python3 -c "from PIL import Image; import piexif; Image.new('RGB',(64,64)).save('t.jpg', exif=piexif.dump({'0th':{271:b'Apple'},'Exif':{},'GPS':{1:b'N',2:((41,1),(6,1),(0,1)),3:b'W',4:((80,1),(39,1),(0,1))},'1st':{}}))"
          unredact.tools scan t.jpg --no-color | tee out.txt
          grep -q "GPS" out.txt
          unredact.tools sanitize t.jpg --no-color
      - name: uninstall
        run: bash install.sh --uninstall && test ! -e "$HOME/.local/bin/unredact.tools"
